plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.github.aakumykov.copy_between_streams_with_counting_demo'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.aakumykov.copy_between_streams_with_counting_demo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            kotlinOptions {
                freeCompilerArgs = ["-Xdebug"]
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation libs.androidx.preference.ktx

    implementation 'com.github.aakumykov.file_lister_navigator_selector_2:file_lister_navigator_selector:21.1.0-alpha'
    implementation 'com.github.aakumykov.file_lister_navigator_selector_2:local_file_lister_navigator_selector:21.1.0-alpha'
    implementation 'com.github.aakumykov:storage_access_helper:3.0.0-alpha'
    implementation 'com.github.aakumykov.cloud_authenticator:cloud_authenticator:0.0.11-alpha'

    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okio:okio:3.17.0'

//    implementation 'com.github.hearsilent:DiscreteSlider:1.2.1'

    implementation project(':seek_bar_with_text_input')
}